# Имя workflow (отображается в GitHub Actions)
name: Run API Tests

# Когда запускать: при каждом push в ветку main и при pull request
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Что делать
jobs:
  test:
    # На какой ОС запускать
    runs-on: ubuntu-latest

    steps:
      # Шаг 1. Склонировать репозиторий в виртуальную машину
      - name: Checkout code
        uses: actions/checkout@v4

      # Шаг 2. Установить Python нужной версии
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Шаг 3. Установить зависимости из requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Шаг 4. Запустить тесты
      - name: Run tests
        run: |
          pytest test_api.py -v